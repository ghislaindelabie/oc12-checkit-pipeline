[project]
name = "checkit"
version = "0.1.0"
description = "Multimodal (text+image) news data acquisition pipeline for fake-news detection"
requires-python = ">=3.12"
dependencies = [
    "requests>=2.32",
    "tenacity>=9.0",
    "feedparser>=6.0",
    "beautifulsoup4>=4.12",
    "lxml>=5.0",
    "trafilatura>=2.0",
    "pillow>=12.0",
    "imagehash>=4.3",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "pandas>=2.2,<3.0",
    "pyarrow>=18.0",
    "psycopg[binary]>=3.2",
    "gdown>=6.1.0",
    "huggingface-hub>=1.18.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "responses>=0.25",
    "ruff>=0.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/checkit"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]
